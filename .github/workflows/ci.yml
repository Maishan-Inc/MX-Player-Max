name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality:media
      - run: pnpm quality:performance
      - run: pnpm quality:audit
      - run: pnpm quality:browsers
      - run: pnpm test:quality
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm quality:acceptance-drift
      - run: pnpm build
      - run: pnpm verify:packages
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
