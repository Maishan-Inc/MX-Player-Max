name: Release SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Type publish to authorize the protected production job.
        required: true
        type: choice
        options:
          - verify
          - publish
        default: verify
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PNPM_VERSION: 10.14.0
  NODE_VERSION: 22

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:packages
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:manifest
      - run: pnpm release:pack

  consumer-smoke:
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:pack
      - run: pnpm release:smoke

  artifact:
    needs: [package, consumer-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:manifest
      - run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mx-player-max-release-assets
          if-no-files-found: error
          path: |
            .release-tmp/release-pack/**
            packages/browser/dist/manifest.json
            packages/browser/dist/*.js
            packages/browser/dist/*.css
            packages/decoder-wasm-vpx/wasm/libvpx-vp8-single.wasm
            packages/decoder-wasm-vpx/wasm/libvpx-vp8-simd.wasm
            packages/decoder-wasm-vpx/wasm/PROVENANCE.md
            packages/decoder-wasm-vpx/third_party/libvpx/LICENSE
            packages/decoder-wasm-vpx/third_party/libvpx/PATENTS

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'publish' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [validate, package, consumer-smoke, artifact]
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish -r --filter './packages/**' --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
